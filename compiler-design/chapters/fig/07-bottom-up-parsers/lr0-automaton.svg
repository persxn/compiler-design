<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 744 688" width="744" height="688" role="img" aria-labelledby="lr0-automaton-t lr0-automaton-d" data-kind="tree" data-count="12">
<title id="lr0-automaton-t">The LR(0) automaton of the expression grammar</title>
<desc id="lr0-automaton-d">Tree, top to bottom. I0 E' -&gt; .E leads to I1 E' -&gt; E. E -&gt; E.+T (E). I0 E' -&gt; .E leads to I2 E -&gt; T. T -&gt; T.*F (T). I0 E' -&gt; .E leads to I3 T -&gt; F. (F). I0 E' -&gt; .E leads to I4 F -&gt; (.E) ((). I0 E' -&gt; .E leads to I5 F -&gt; id. (id). I1 E' -&gt; E. E -&gt; E.+T leads to I6 E -&gt; E+.T (+). I2 E -&gt; T. T -&gt; T.*F leads to I7 T -&gt; T*.F (*). I4 F -&gt; (.E) leads to I8 F -&gt; (E.) E -&gt; E.+T (E). I6 E -&gt; E+.T leads to I9 E -&gt; E+T. T -&gt; T.*F (T). I7 T -&gt; T*.F leads to I10 T -&gt; T*F. (F). I8 F -&gt; (E.) E -&gt; E.+T leads to I11 F -&gt; (E). ()). I0 E' -&gt; .E is highlighted.</desc>
