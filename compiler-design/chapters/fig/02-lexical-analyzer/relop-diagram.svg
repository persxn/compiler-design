<title id="relop-diagram-t">Transition diagram for &lt; &lt;= &gt; &gt;= = == !=</title>
<desc id="relop-diagram-d">Flow chart, left to right. 0 start leads to 1 (&lt;). 0 start leads to 4 (&gt;). 0 start leads to 7 (=). 0 start leads to 10 (!). 1 leads to 2 return LE (=). 1 leads to 3 * return LT (other). 4 leads to 5 return GE (=). 4 leads to 6 * return GT (other). 7 leads to 8 return EQ (=). 7 leads to 9 * return ASSIGN (other). 10 leads to 11 return NE (=). 2 return LE, 3 * return LT, 5 return GE, 6 * return GT, 8 return EQ, 9 * return ASSIGN and 11 return NE are highlighted.</desc>
