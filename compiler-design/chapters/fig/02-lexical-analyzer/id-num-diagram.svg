<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 768" width="560" height="768" role="img" aria-labelledby="id-num-diagram-t id-num-diagram-d" data-kind="flow" data-count="10">
<title id="id-num-diagram-t">Transition diagrams for identifiers and Tiny numbers</title>
<desc id="id-num-diagram-d">Flow chart, top to bottom. 12 start leads to 13 loop on letter, digit or _ (letter or _). 15 start leads to 16 loop on digit (digit). 13 loop on letter, digit or _ leads to 14 * return lookup() (other). 16 loop on digit leads to 18 * return NUM (other). 16 loop on digit leads to 17 (.). 17 leads to 19 loop on digit (digit). 17 leads to no other edge out of 17: 5. is an error by a dashed arrow. 19 loop on digit leads to 20 * return NUM (other). 14 * return lookup(), 18 * return NUM and 20 * return NUM are highlighted.</desc>
