<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 472 1024" width="472" height="1024" role="img" aria-labelledby="phases-t phases-d" data-kind="flow" data-count="9">
<title id="phases-t">The phases of a compiler</title>
<desc id="phases-d">Flow chart, top to bottom. characters pos = init + rate * 60; leads to Lexical analyzer. Symbol table is joined to Lexical analyzer. Symbol table is joined to Semantic analyzer. Symbol table is joined to Code generator. Lexical analyzer leads to Syntax analyzer (tokens). Syntax analyzer leads to Semantic analyzer (tree). Semantic analyzer leads to Intermediate code generator (checked tree). Intermediate code generator leads to Code optimizer (three-address code). Code optimizer leads to Code generator. Code generator leads to target code. Lexical analyzer, Syntax analyzer, Semantic analyzer and Intermediate code generator are highlighted. Code optimizer and Code generator are greyed out.</desc>
