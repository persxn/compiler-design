<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 416 624" width="416" height="624" role="img" aria-labelledby="pp-stack-t pp-stack-d" data-kind="memory" data-count="12">
<title id="pp-stack-t">pp's stack for i+i*i, bottom on the left</title>
<desc id="pp-stack-d">Memory. before move 1: start, E on $. It holds s1. s1 holds $ and E. s1[1] is highlighted. before move 2: E replaced by T R, pushed R first. It holds s2. s2 holds $, R and T. s2[2] is highlighted. before move 4: the terminal i on top, i in hand. It holds s4. s4 holds $, R, Y and i. s4[3] is highlighted. before move 5: i matched and popped. It holds s5. s5 holds $, R and Y. s5[2] is highlighted.</desc>
