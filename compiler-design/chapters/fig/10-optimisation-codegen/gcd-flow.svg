<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 504 768" width="504" height="768" role="img" aria-labelledby="gcd-flow-t gcd-flow-d" data-kind="flow" data-count="7">
<title id="gcd-flow-t">Flow graph of gcd.tiny</title>
<desc id="gcd-flow-d">Flow chart, top to bottom. B1 a = 48, b = 18 leads to B2 L1: ifFalse a != b goto L2. B2 L1: ifFalse a != b goto L2 leads to B3 ifFalse a &gt; b goto L3 (a != b). B2 L1: ifFalse a != b goto L2 leads to B7 L2: exit (a == b). B3 ifFalse a &gt; b goto L3 leads to B4 t1 = a - b, a = t1, goto L4 (a &gt; b). B3 ifFalse a &gt; b goto L3 leads to B5 L3: t2 = b - a, b = t2 (a &lt;= b). B4 t1 = a - b, a = t1, goto L4 leads to B6 L4: goto L1. B5 L3: t2 = b - a, b = t2 leads to B6 L4: goto L1. B6 L4: goto L1 leads back to B2 L1: ifFalse a != b goto L2. B2 L1: ifFalse a != b goto L2, B3 ifFalse a &gt; b goto L3, B4 t1 = a - b, a = t1, goto L4, B5 L3: t2 = b - a, b = t2 and B6 L4: goto L1 are highlighted.</desc>
